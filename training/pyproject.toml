[project]
name = "ktb-digit-training"
version = "0.1.0"
description = "Trains the digit classifier used to read the card's digit boxes"
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "numpy>=1.26",
    "onnx>=1.16",
    "onnxscript>=0.1",
    "pillow>=10",
    "scipy>=1.11",
]
